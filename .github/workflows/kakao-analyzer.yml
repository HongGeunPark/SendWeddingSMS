name: 카톡 분석기 테스트

on:
  push:
    branches: [main]
    paths: ['kakao-analyzer/**', '.github/workflows/kakao-analyzer.yml']
  pull_request:
    paths: ['kakao-analyzer/**', '.github/workflows/kakao-analyzer.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests
        working-directory: kakao-analyzer
        env:
          TZ: Asia/Seoul
        run: node test/run-tests.js
