name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk SendWeddingSMS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SendWeddingSMS-apk
          path: SendWeddingSMS.apk

      # main에 올라간 최신 버전을 Releases의 "latest"에 APK로 올린다.
      - name: Publish to Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SendWeddingSMS.apk \
            --title "최신 APK" \
            --notes "커밋 ${GITHUB_SHA::7} 에서 빌드한 APK예요. 폰에서 SendWeddingSMS.apk를 받아 설치하세요." \
            --target "$GITHUB_SHA"
